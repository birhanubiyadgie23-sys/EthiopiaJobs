<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Ethiopia Jobs</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 32px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #123b66;
      font-size: 25px;
    }

    .subtitle {
      margin: 0 0 28px;
      text-align: center;
      color: #64748b;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      color: #334155;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #2563eb;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #123b66;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: #dc2626;
    }

    #message.success {
      color: #15803d;
    }
  </style>
</head>
<body>

  <main class="login-box">
    <h1>Ethiopia Jobs</h1>
    <p class="subtitle">የአስተዳዳሪ Login</p>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

      <div id="message" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "";
      message.className = "";
      button.disabled = true;
      button.textContent = "በመግባት ላይ...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(
            result.error === "Invalid email or password"
              ? "Email ወይም Password ትክክል አይደለም።"
              : "Login አልተሳካም። እንደገና ይሞክሩ።"
          );
        }

        message.textContent = "Login ተሳክቷል። Dashboard በመክፈት ላይ...";
        message.className = "success";

        window.location.replace("/admin-dashboard.html");

      } catch (error) {
        message.textContent =
          error.message || "የኔትወርክ ችግር ተፈጥሯል።";
      } finally {
        button.disabled = false;
        button.textContent = "Login";
      }
    });
  </script>

</body>
</html>
